name: agency-crm

x-backend: &backend
  build: ./backend
  environment: &backend-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    DJANGO_DEBUG: "0"
    DJANGO_ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN in .env},backend,localhost
    DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
    POSTGRES_DB: ${POSTGRES_DB:-agency_crm}
    POSTGRES_USER: ${POSTGRES_USER:-agency_crm}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_HOST: db
    TELEGRAM_API_SECRET: ${TELEGRAM_API_SECRET:?Set TELEGRAM_API_SECRET in .env}
  volumes:
    - static_data:/app/staticfiles

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agency_crm}
      POSTGRES_USER: ${POSTGRES_USER:-agency_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  init:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  bot:
    profiles: ["telegram"]
    build: ./bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_SECRET: ${TELEGRAM_API_SECRET:?Set TELEGRAM_API_SECRET in .env}
      CRM_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    volumes:
      - static_data:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  static_data:
  caddy_data:
  caddy_config:
